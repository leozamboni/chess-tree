<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Defesa Siciliana</title>
  <link rel="stylesheet" href="vendor/chessboard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top">
    <div>
      <label class="opening" for="opening">Abertura
        <select id="opening">
          <option value="sicilian">Defesa Siciliana</option>
          <option value="scandinavian">Defesa Escandinava</option>
          <option value="slav">Defesa Eslava</option>
          <option value="orthodox">Defesa Ortodoxa</option>
          <option value="spanish">Abertura Espanhola</option>
        </select>
      </label>
      <p class="hint">Arraste para mover a árvore. A roda do mouse ou a pinça mudam o zoom. Clique para abrir um ramo. Num tabuleiro sem continuação, o clique pede ao Stockfish (🐟) os próximos lances.</p>
    </div>
    <div class="zoom">
      <button type="button" id="flip">Pretas embaixo</button>
      <button type="button" id="zoom-out">−</button>
      <span id="zoom-label">100%</span>
      <button type="button" id="zoom-in">+</button>
    </div>
  </div>
  <div id="view"><div id="scaler"><div id="tree"></div></div></div>
  <script src="vendor/jquery.min.js"></script>
  <script src="vendor/chessboard.min.js"></script>
  <script src="chess.js"></script>
  <script src="openings.js"></script>
  <script src="tree.js"></script>
</body>
</html>
